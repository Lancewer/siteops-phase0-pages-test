change_schema_version: 2
meta:
  change_id: chg_20260907_task_01
  title: 新建计算器页面
  status: live
  site_ref: site://siteops-phase0-pages-test
  created_by: web:lancewer@qq.com
  created_at: '2026-09-07T14:36:34Z'
  updated_at: '2026-09-08T07:37:28Z'
source:
  kind: growth
  ref: null
  untrusted: false
intent:
  summary: 新建一个极简的计算器页面
  success_criteria:
  - public/index.html 存在且为有效 HTML（含 DOCTYPE、viewport meta、显示区元素）
  - 页面含数字键 0-9、运算符 + − × ÷、C 与 = 键
  - 四则运算抽查全部正确（2+3=5、7−4=3、6×8=48、9÷3=3、10÷4=2.5、连续运算 1+2+3=6）
  - 除零显示 Error，C 键复位显示 0
  - 页面无任何 http(s) 外部资源引用，本地直接打开可用
  - 未写入任何 scope 之外的路径（无 .env*、secrets/**、siteops/changes/** 变更）
scope:
  allowed_write_paths:
  - public/**
  forbidden_write_paths:
  - .env*
  - secrets/**
  - siteops/changes/**
  allowed_route_prefixes: []
workflow_policy:
  risk:
    level: medium
    factors: []
  route:
    selected: full
    reason: 网页新建的 draft，默认完整流程，待 daemon 起草后人工审阅
  required_capabilities:
  - execution_contract
  - checkpoint
  - verification
  framework:
    requested: plainspec
    selected: plainspec
    version: '0.1'
  approvals:
    execution:
      required: true
      includes:
      - intent
      - spec
      - plan
      - tasks
      - contract
    release:
      required: true
artifacts:
  intent:
    path: intent.md
    mutable_until: execution_approved
  context:
    path: context.md
    mutable_until: execution_approved
  spec:
    path: spec.md
    mutable_until: execution_approved
  plan:
    path: plan.md
    mutable_until: execution_approved
  tasks:
    path: tasks.yaml
    mutable_until: execution_approved
  contract:
    path: contract.md
    mutable_until: execution_approved
  verification:
    path: verification.yaml
    mutable_until: release_approved
  lock:
    path: change.lock.yaml
    mutable_until: never
