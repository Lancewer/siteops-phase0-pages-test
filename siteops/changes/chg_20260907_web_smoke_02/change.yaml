change_schema_version: 2

meta:
  change_id: chg_20260907_web_smoke_02
  title: '控制台建单冒烟 2'
  status: draft
  site_ref: site://siteops-phase0-pages-test
  created_by: web:lancewer@qq.com
  created_at: "2026-09-07T05:54:00Z"
  updated_at: "2026-09-07T05:54:00Z"

source:
  kind: maintenance
  ref: null
  untrusted: false

intent:
  summary: '验证 seq 递推'
  success_criteria: []

scope:
  allowed_write_paths:
    - 'public/**'
  forbidden_write_paths:
    - '.env*'
    - 'secrets/**'
    - 'siteops/changes/**'
  allowed_route_prefixes: []

workflow_policy:
  risk:
    level: medium
    factors: []
  route:
    selected: full
    reason: 网页新建的 draft，默认完整流程，待 daemon 起草后人工审阅
  required_capabilities:
    - execution_contract
    - checkpoint
    - verification
  framework:
    requested: plainspec
    selected: plainspec
    version: "0.1"
  approvals:
    execution:
      required: true
      includes: [intent, spec, plan, tasks, contract]
    release:
      required: true

artifacts:
  intent:       { path: intent.md,         mutable_until: execution_approved }
  context:      { path: context.md,        mutable_until: execution_approved }
  spec:         { path: spec.md,           mutable_until: execution_approved }
  plan:         { path: plan.md,           mutable_until: execution_approved }
  tasks:        { path: tasks.yaml,        mutable_until: execution_approved }
  contract:     { path: contract.md,       mutable_until: execution_approved }
  verification: { path: verification.yaml, mutable_until: release_approved }
  lock:         { path: change.lock.yaml,  mutable_until: never }

acceptance:
  pre_commit: []
  local_build: []
  pages_build: []
  preview: []
  manual: []
